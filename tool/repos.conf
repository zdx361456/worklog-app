# ===========================================================================
#  repos.conf —— 双远程仓库配置（GitHub + Gitee）
#
#  被 tool/git-sync.sh 与 tool/check-repos.sh 用 `source` 读入。
#  换仓库 / 换账号只改这里，脚本一行都不用动。
#
#  为什么用 SSH：本机 github.com:443 被代理拦死（CONNECT tunnel failed, 502），
#  必须走 22 端口；两个平台的公钥都已注册，推送不需要任何令牌。
# ===========================================================================

# ---- GitHub ---------------------------------------------------------------
GITHUB_REMOTE="github"
GITHUB_HOST="github.com"
GITHUB_SLUG="zdx361456/worklog-app"
GITHUB_SSH="git@github.com:zdx361456/worklog-app.git"

# ---- Gitee ----------------------------------------------------------------
GITEE_REMOTE="gitee"
GITEE_HOST="gitee.com"
GITEE_SLUG="clouds_and_clouds_on_the_sea/worklog-app"
GITEE_SSH="git@gitee.com:clouds_and_clouds_on_the_sea/worklog-app.git"

# ---- 公共 -----------------------------------------------------------------
BRANCH="main"

# ---- 令牌（可选；只有查私有仓库可见性时才需要）----------------------------
#  公开仓库的可见性用匿名 API 就能查，所以平时不需要令牌。
#  真需要时放到仓库外，绝不写进本仓库：
#      ~/.workbuddy/secrets/worklog.env
#      内容形如：  GITHUB_TOKEN=ghp_xxx
#                  GITEE_TOKEN=yyy
SECRETS_FILE="${HOME}/.workbuddy/secrets/worklog.env"
